# opt_moe for vLLM without torchtitan: pip install ./vllm_plugins/opt_moe, then
# vllm serve <an opt_moe HF folder> --trust-remote-code
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-opt-moe"
version = "0.5.5"
description = "vLLM plugin: torchtitan's opt_moe HF checkpoints (q / k / v short conv, sinks, gate, sigmoid MoE)"
requires-python = ">=3.11"
dependencies = ["vllm"]

[project.entry-points."vllm.general_plugins"]
register_opt_moe = "vllm_opt_moe:register"

[tool.setuptools.packages.find]
include = ["vllm_opt_moe*"]
